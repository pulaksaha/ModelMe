services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - modelme-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  reconstruction:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/reconstruction/Dockerfile
      args:
        BLENDER_VERSION: 5.2.3
    restart: unless-stopped
    environment:
      BLENDER_EXECUTABLE: /opt/blender/blender
      BLENDER_TIMEOUT_SECONDS: ${BLENDER_TIMEOUT_SECONDS:-300}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ORIGINS: ""
    expose:
      - "8000"
    volumes:
      - modelme-input:/app/input
      - modelme-generated:/app/storage/generated
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); raise SystemExit(0 if d['status']=='ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/modelme
      PROCESSING_SERVICE_URL: http://reconstruction:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Compose}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:3001"
    depends_on:
      mongo:
        condition: service_healthy
      reconstruction:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  modelme-mongo:
  modelme-input:
  modelme-generated:
